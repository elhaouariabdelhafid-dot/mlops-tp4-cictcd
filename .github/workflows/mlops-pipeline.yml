name: MLOps CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint - Ruff
        run: ruff check .

      - name: Unit and Data Tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest \
            tests/test_unit.py \
            tests/test_data.py -v

      - name: Model Quality Gates
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/test_model.py -v

      - name: Code Coverage
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Security - Bandit
        run: bandit src/data.py src/model.py src/train.py train_and_register.py promote.py

      - name: Security - pip-audit
        run: pip-audit

  staging:
    name: Deploy to Staging
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Simulated staging deployment
        run: echo "Deploy candidate to STAGING"

  production:
    name: Deploy to Production
    needs: staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Simulated production deployment
        run: echo "Deploy champion to PRODUCTION"
